# pnpm workspace 定义。
# catalog 是所有依赖版本的单一来源（single source of truth）：
# 各 package.json 使用 "catalog:" 引用，避免版本在多处漂移。
# 版本均为安装前核对官方 peer/engines 兼容性后锁定的确切版本，不使用 ^ / ~ 浮动范围。
packages:
  - 'apps/*'
  - 'worker'
  - 'packages/*'

allowBuilds:
  # pnpm 10+ 默认阻止依赖运行安装脚本（供应链防护）。
  # 只放行本项目**确实需要**的两类二进制：esbuild（打包）与 workerd（Workers 运行时）。
  # 其余依赖一律不授予安装脚本权限。
  esbuild: true
  workerd: true

catalog:
  # --- 语言/类型系统 -------------------------------------------------------
  # TypeScript 固定在 5.9.3：typescript-eslint@8.71.2 的 peer 为 ">=4.8.4 <6.1.0"，
  # 当前最新 TS 7.0.2 不被 ESLint 类型规则支持，因此不得升级到 7.x。
  typescript: 5.9.3
  '@types/node': 26.6.5
  '@cloudflare/workers-types': 5.20261016.1

  # --- 测试 ---------------------------------------------------------------
  # vitest 固定在 4.1.12：@cloudflare/vitest-pool-workers@0.23.0 的 peer 为 ^4.1.0，
  # 不能用最新的 vitest 5.x。
  vitest: 4.1.12
  '@cloudflare/vitest-pool-workers': 0.23.0
  # React 组件测试（HUB-044 验收）。
  # @testing-library/react@16.3.3 的 peer：react ^18||^19、@testing-library/dom ^10。
  '@testing-library/react': 16.3.3
  '@testing-library/dom': 10.4.2
  '@testing-library/user-event': 14.6.8
  # jsdom 固定在 28.1.0：engines 为 ^20.19.0 || ^22.12.0 || >=24.0.0，
  # 与本仓库 engines 的最低版本（22.12.0）一致；更新版本要求 ^22.22.2，会窄于本仓库声明。
  jsdom: 28.1.0
  # 真实浏览器验收链（HUB-044 验收要求）。
  '@playwright/test': 1.64.1

  # --- Worker / Cloudflare -------------------------------------------------
  # wrangler 4.151.1 要求 node >=22.0.0（本仓库 engines 为 >=22.12.0）。
  wrangler: 4.151.1
  hono: 4.13.13
  zod: 4.6.7
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11

  # --- Web ----------------------------------------------------------------
  # react-grid-layout 锁定 2.3.0（HUB-045 布局编辑器）：
  # - 官方当前版本 2.3.0（npm time.modified 2026-10-05），peer 为 react >= 16.3.0，
  #   因此在 React 19.3.1 上可用；2.x 自带 `dist/index.d.ts` 类型，**不需要**
  #   @types/react-grid-layout（该包只到 2.1.0，属于旧 API 的形状）。
  # - 2.x 是 ESM（`dist/index.mjs`）并提供 exports 映射（含 `./css/styles.css`），
  #   与 Vite 8 的 ESM 解析一致。
  # - 2.x 起推荐通过 nodeRef 驱动拖拽，不再依赖 React 19 已移除的 ReactDOM.findDOMNode。
  react-grid-layout: 2.3.0
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  vite: 8.3.4
  # @vitejs/plugin-react@6.1.2 的 peer 要求 vite ^8.0.0，与上面的 vite 8.3.4 对齐。
  '@vitejs/plugin-react': 6.1.2

  # --- Lint ---------------------------------------------------------------
  eslint: 10.13.0
  '@eslint/js': 10.0.1
  # typescript-eslint@8.71.2 peer: eslint ^8.57 || ^9 || ^10 → 与 eslint 10 兼容。
  typescript-eslint: 8.71.2
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.13.0
