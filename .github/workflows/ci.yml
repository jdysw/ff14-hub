# FF14 Hub CI：3 个矩阵检查结果，统一安装环境，不丢失任何原验收链。
# core：质量、两环境 dry-run、D1 双重迁移、备份恢复；其余两组跑共 8 条隔离 E2E。
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt an in-flight remote migration/deployment on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: core
            label: lint / typecheck / test / build
            e2e: ''
          - kind: product
            label: 浏览器验收 / product-flows
            e2e: e2e:phase02 e2e:phase03 e2e:phase04 e2e:phase05
          - kind: privacy
            label: 浏览器验收 / privacy-and-sync
            e2e: e2e:phase05b e2e:phase06a e2e:phase06b e2e:phase06c
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node/pnpm and frozen dependencies
        uses: ./.github/actions/setup-ci
      - name: 已知生产依赖漏洞审计
        if: matrix.kind == 'core'
        run: pnpm run audit:prod
      - name: Worker 绑定类型与 Wrangler 配置一致性
        if: matrix.kind == 'core'
        run: pnpm run types:worker:check
      - name: Lint
        if: matrix.kind == 'core'
        run: pnpm run lint
      - name: Typecheck
        if: matrix.kind == 'core'
        run: pnpm run typecheck
      - name: Workers 与 Node 测试
        if: matrix.kind == 'core'
        run: pnpm run test
      - name: 前端/Worker 构建
        if: matrix.kind == 'core'
        run: pnpm run build
      - name: Cloudflare 两环境打包 dry-run（不部署）
        if: matrix.kind == 'core'
        run: pnpm run validate:config
      - name: D1 本地首次及重复迁移
        if: matrix.kind == 'core'
        run: |
          pnpm exec wrangler d1 migrations apply DB --local
          pnpm exec wrangler d1 migrations apply DB --local
      - name: 运维脚本测试
        if: matrix.kind == 'core'
        run: pnpm run test:ops
      - name: 独立本地环境备份及恢复演练
        if: matrix.kind == 'core'
        run: pnpm run ops:rehearse
      - name: 安装 Chromium（每组一次）
        if: matrix.kind != 'core'
        run: pnpm exec playwright install --with-deps chromium
      - name: 保留全部独立环境验收链及失败诊断
        if: matrix.kind != 'core'
        shell: bash
        env:
          E2E_SCRIPTS: ${{ matrix.e2e }}
        run: node scripts/ci-e2e-runner.mjs ${E2E_SCRIPTS}

  deploy:
    name: Cloudflare production
    needs: check
    # PRs and non-main manual runs never receive deployment credentials.
    if: >-
      github.repository == 'jdysw/ff14-hub' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - name: Checkout exact verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node/pnpm and frozen dependencies
        uses: ./.github/actions/setup-ci
      - name: Release configuration preflight
        run: pnpm run ops:preflight
      - name: Build frontend assets
        run: pnpm run build:web
      - name: Skip superseded main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest=$(gh api repos/jdysw/ff14-hub/git/ref/heads/main --jq '.object.sha')
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; deployment skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Apply migrations and deploy
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing repository secret CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing repository secret CLOUDFLARE_ACCOUNT_ID}"
          pnpm exec wrangler d1 migrations apply DB --remote --env production
          # 由部署运行器主动取回官方公告；Worker 直接读取 D1，避免边缘出站故障。
          node scripts/ops/snapshot-official-calendar.mjs "$RUNNER_TEMP/official-calendar.sql"
          pnpm exec wrangler d1 execute DB --remote --env production --file "$RUNNER_TEMP/official-calendar.sql"
          pnpm exec wrangler deploy --env production
      - name: Verify deployed assets and database health
        if: steps.current.outputs.deploy == 'true'
        run: node scripts/ops/verify-live.mjs production
