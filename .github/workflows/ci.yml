# FF14 Hub CI：3 个矩阵检查结果，统一安装环境，不丢失任何原验收链。
# core：质量、两环境 dry-run、D1 双重迁移、备份恢复；其余两组跑共 8 条隔离 E2E。
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: core
            label: lint / typecheck / test / build
            e2e: ''
          - kind: product
            label: 浏览器验收 / product-flows
            e2e: e2e:phase02 e2e:phase03 e2e:phase04 e2e:phase05
          - kind: privacy
            label: 浏览器验收 / privacy-and-sync
            e2e: e2e:phase05b e2e:phase06a e2e:phase06b e2e:phase06c
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node/pnpm and frozen dependencies
        uses: ./.github/actions/setup-ci
      - name: 已知生产依赖漏洞审计
        if: matrix.kind == 'core'
        run: pnpm run audit:prod
      - name: Worker 绑定类型与 Wrangler 配置一致性
        if: matrix.kind == 'core'
        run: pnpm run types:worker:check
      - name: Lint
        if: matrix.kind == 'core'
        run: pnpm run lint
      - name: Typecheck
        if: matrix.kind == 'core'
        run: pnpm run typecheck
      - name: Workers 与 Node 测试
        if: matrix.kind == 'core'
        run: pnpm run test
      - name: 前端/Worker 构建
        if: matrix.kind == 'core'
        run: pnpm run build
      - name: Cloudflare 两环境打包 dry-run（不部署）
        if: matrix.kind == 'core'
        run: pnpm run validate:config
      - name: D1 本地首次及重复迁移
        if: matrix.kind == 'core'
        run: |
          pnpm exec wrangler d1 migrations apply DB --local
          pnpm exec wrangler d1 migrations apply DB --local
      - name: 运维脚本测试
        if: matrix.kind == 'core'
        run: pnpm run test:ops
      - name: 独立本地环境备份及恢复演练
        if: matrix.kind == 'core'
        run: pnpm run ops:rehearse
      - name: 安装 Chromium（每组一次）
        if: matrix.kind != 'core'
        run: pnpm exec playwright install --with-deps chromium
      - name: 保留全部独立环境验收链及失败诊断
        if: matrix.kind != 'core'
        shell: bash
        env:
          E2E_SCRIPTS: ${{ matrix.e2e }}
        run: node scripts/ci-e2e-runner.mjs ${E2E_SCRIPTS}
