name: Temporary Sonar annotations review
on:
  push:
    branches: [codex/phase06g-alpha-release]
permissions:
  contents: read
  checks: read
jobs:
  read-sonar-annotations:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read Security and Reliability check annotations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          for pr,check_id in [(29,117824421368),(31,117893712927)]:
              url=f'https://api.github.com/repos/jdysw/ff14-hub/check-runs/{check_id}/annotations?per_page=100'
              req=urllib.request.Request(url,headers={
                  'Authorization': 'Bearer '+os.environ['GITHUB_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'ff14-hub-quality-review'
              })
              print('--- PR',pr,'Sonar annotations ---')
              try:
                  with urllib.request.urlopen(req,timeout=15) as response:
                      data=json.load(response)
                      print('HTTP',response.status,'COUNT',len(data))
                      for item in data:
                          print('ISSUE',json.dumps({
                              k:item.get(k) for k in ('path','start_line','annotation_level','title','message')
                          },ensure_ascii=False)[:900])
              except Exception as error:
                  print('READ_ERROR',type(error).__name__,str(error))
          PY
